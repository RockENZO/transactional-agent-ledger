[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transactional-agent-ledger"
version = "0.1.0"
description = "Verifier-gated, rollback-capable task ledger for tool-using LLM agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
